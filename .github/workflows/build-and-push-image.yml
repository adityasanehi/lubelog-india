name: Build and Push Image to Dockerhub and GHCR

on:
  push:
    branches: ["main", "feature/workshop-invoice-mcp"]
    tags: ["v*"]
  pull_request:
  release:
    types: ["published"]

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check workshop API and MCP on disposable data
        env:
          MCP_SOURCE: ${{ runner.temp }}/workshop-mcp
          MCP_REF: ${{ vars.WORKSHOP_MCP_REF || 'feature/workshop-invoice-mcp' }}
        run: |
          git clone --depth 1 --branch "$MCP_REF" https://github.com/adityasanehi/lubelog_mcp.git "$MCP_SOURCE"
          bash Tests/run-workshop.sh
  build:
    needs: checks
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DH_USER }}
      DH_PASS: ${{ secrets.DH_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && env.DH_USER != '' && env.DH_PASS != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_USER }}
          password: ${{ secrets.DH_PASS }}
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/adityasanehi/lubelog-india
            ${{ env.DH_USER != '' && env.DH_PASS != '' && format('{0}/lubelog-india', env.DH_USER) || '' }}
          tags: |
            type=edge,branch=main
            type=sha,format=long
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
